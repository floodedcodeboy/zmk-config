CONFIG_ZMK_SPLIT=y
# CONFIG_ZMK_USB=y

# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_KEYBOARD_NAME="blimeyTM"

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Increase bluetooth wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Tune bluetooth profiles for quick select
CONFIG_BT_MAX_CONN=5
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Uncomment the following line if you facing issue on win 11 connection
# Enables a combination of settings that are planned to be default in future
# versions of ZMK to improve connection stability. This includes changes to
# timing on BLE pairing initiation, restores use of the updated/new LLCP
# implementation, and disables 2M PHY support.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Sleep & Idle configuration
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

# Number of milliseconds of inactivity before entering idle state
# 1 hour 
# CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_TIMEOUT=600000
# 30 min (30*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# CONFIG_ZMK_IDLE_TIMEOUT=120000
# Disable external power when not connected to USB
# CONFIG_ZMK_EXT_POWER_USB_ONLY=y

### Display Settings
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Black on white. CONFIG_ZMK_DISPLAY_INVERT does nothing here: the nice!view (ls0xx) driver only supports one pixel format
CONFIG_NICE_OLED_WIDGET_INVERTED=y

### WIDGET SETTINGS
# No Widget configurations added since nice!view has its own custom widgets
# activar solo estos dos widgets
# CONFIG_ZMK_WIDGET_WPM_STATUS=n
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# nice!view settings
CONFIG_NICE_EPAPER_ON=y
# CONFIG_NICE_OLED_GEM_ANIMATION=n
# CONFIG_NICE_OLED_GEM_ANIMATION_MS=1920
# CONFIG_NICE_OLED_GEM_ANIMATION_WPM_FIXED_RANGE=y
# CONFIG_NICE_OLED_GEM_ANIMATION_WPM_FIXED_RANGE_MAX=120
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=300
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA_ANIMATION_MS=300
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
# Modifiers as fixed macOS symbols in a 2x2 box (left/central only, the peripheral never sees mod state)
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=y
# The module defaults to x=62 on a 68px-wide canvas, which clips the box; centre it below Luna
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=19
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=66
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n

# Sleep art on idle/sleep (both halves). The NICE_OLED_* options build the widget,
# the NICE_PERI_VIEW_* options (defined in /Kconfig) make it actually show.
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y
CONFIG_NICE_PERI_VIEW_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_PERI_VIEW_SHOW_SLEEP_ART_ON_SLEEP=y
# nice_epaper blanks the display on idle by default, which would hide the art
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

### Enable eager debouncing, attempt to lower input lag
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# pointing support
CONFIG_ZMK_POINTING=y

# Battery Reporting
CONFIG_ZMK_BATTERY_REPORTING=y	
# Peripheral Battery Monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Prevent BLE Battery Reporting on MacOS from waking up host from sleep
CONFIG_BT_BAS=n

### Improves compatibility with iPad
# ref: https://zmk.dev/docs/config/system#hid
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# RDP compatibility.
# CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=y

# NKRO
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# enable F13-F24
# CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

### DEBUG OPTIONS
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000